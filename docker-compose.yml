services:
  bdd:
    image: postgres:16-alpine
    container_name: sensai-bdd
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensai_password}
      POSTGRES_DB: ${POSTGRES_DB:-sensai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensai_user} -d ${POSTGRES_DB:-sensai}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sensai-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vector_db
    ports:
      - "6333:6333" # API REST
      - "6334:6334" # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  ia:
    image: ollama/ollama:latest
    container_name: sensai-ia
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sensai-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sensai-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sensai_user}:${POSTGRES_PASSWORD:-sensai_password}@bdd:5432/${POSTGRES_DB:-sensai}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ia:11434}
      PORT: ${BACKEND_PORT:-8080}
    volumes:
      - ./backend:/app/backend:z
      - ./src:/app/src:z
      - ./manuscrit_royaumes:/app/manuscrit_royaumes:z
      - ./storage:/app/storage
    depends_on:
      bdd:
        condition: service_healthy
      ia:
        condition: service_started
    networks:
      - sensai-network

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sensai-front
    ports:
      - "${FRONT_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - sensai-network

networks:
  sensai-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  openwebui_data:
  qdrant_data:
