name: CI - Build & Feature Validation

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --legacy-peer-deps --prefer-offline --no-audit
          fi

      - name: Run linter (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Archive frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend & CLI (Tests & Syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt

      - name: Check Python bytecode & syntax (compileall)
        run: |
          python -m compileall -q backend src tests

      - name: Run Pytest test suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v --durations=10

  docker:
    name: Docker Containers & Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sensai-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: sensai-front:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  ci-status:
    name: CI Status Gatekeeper
    needs: [frontend, backend, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary and Evaluate Pipeline
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feature / Service | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Lint, Typecheck & Vite Build) | \`${{ needs.frontend.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend & CLI (Syntax Check & Pytest) | \`${{ needs.backend.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker (Compose Config & Container Builds) | \`${{ needs.docker.result }}\` |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Échec de la validation CI sur une ou plusieurs fonctionnalités.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Toutes les fonctionnalités ont été construites et testées avec succès !**" >> $GITHUB_STEP_SUMMARY

